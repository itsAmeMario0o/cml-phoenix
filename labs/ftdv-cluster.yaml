- id: n8
  label: inside-host
  node_definition: ubuntu
  image_definition: ubuntu-24-04-20260307
  x: -200
  y: 120
  interfaces:
  - id: n8-ens2
    label: ens2
    type: physical
    slot: 0
  - id: n8-ens3
    label: ens3
    type: physical
    slot: 1
  configuration:
  - name: user-data
    content: |-
      #cloud-config
      hostname: inside-host
      manage_etc_hosts: true
      ssh_pwauth: true
      users:
        - name: cisco
          groups: sudo
          sudo: ALL=(ALL) NOPASSWD:ALL
          shell: /bin/bash
          lock_passwd: false
          ssh_authorized_keys:
            - __LAB_SSH_PUBKEY__
      chpasswd:
        users:
          - name: cisco
            password: '__LAB_PASSWORD__'
            type: text
        expire: false
      write_files:
        # virtio reports no link speed, and the 802.3ad bonding driver
        # will not aggregate a member with unknown speed, so the Nexus
        # never sees an LACP PDU. Pinning 1000/full on both members
        # fixes it; the unit reapplies it on every boot before netplan.
        - path: /etc/systemd/system/bond-speed.service
          permissions: '0644'
          content: |
            [Unit]
            Description=Pin link speed on virtio bond members for LACP
            Before=systemd-networkd.service
            After=sys-subsystem-net-devices-ens2.device sys-subsystem-net-devices-ens3.device
            [Service]
            Type=oneshot
            ExecStart=/usr/sbin/ethtool -s ens2 speed 1000 duplex full
            ExecStart=/usr/sbin/ethtool -s ens3 speed 1000 duplex full
            [Install]
            WantedBy=network-pre.target
        - path: /etc/netplan/60-bond.yaml
          permissions: '0600'
          content: |
            network:
              version: 2
              ethernets:
                ens2:
                  dhcp4: false
                ens3:
                  dhcp4: false
              bonds:
                bond0:
                  interfaces: [ens2, ens3]
                  parameters:
                    mode: 802.3ad
                    lacp-rate: fast
                    mii-monitor-interval: 100
                    transmit-hash-policy: layer3+4
                  addresses: [10.10.0.100/24]
                  routes:
                    - to: default
                      via: 10.10.0.1
      runcmd:
        - systemctl enable bond-speed.service
        - ethtool -s ens2 speed 1000 duplex full
        - ethtool -s ens3 speed 1000 duplex full
        - rm -f /etc/netplan/50-cloud-init.yaml
        - netplan apply
