# TrustSec Phase 2: one Catalyst 9000v access switch on the host transit
# bridge, three endpoints on one VLAN, two firewalls, and a server.
# Spec: docs/specs/2026-09-17-trustsec-phase2-design.md.
#
# asa1 and ftd1 must never run together. Both hold 10.100.11.2 on the
# firewall VLAN and 10.100.20.1 toward the server; start one, stop the
# other, and the switch's route and the server's gateway never change.
#
# Act 1, the SNMP inventory, starts bridge1, sw1, emp-pc, iot-dev and
# kali. The firewalls, sw2 and srv stay stopped. The day-0 carries no
# snmp-server lines on purpose: Act 1 step 2 adds SNMP by hand, so what
# ISE sees is what the procedure produced, not what the file shipped.
# RADIUS, AAA, MAB and 802.1X stay in the day-0 because they are proven on
# this image (the cat9kv probe of 2026-09-17) and the three access ports
# run `authentication open`, so an endpoint gets its lease whether or not
# ISE ever answers. Act 2 step 5 removes `authentication open`, step 6
# uncomments `cts role-based enforcement`, and step 7 uncomments `cts
# manual` on the two firewall ports; those lines are in the file, commented.
#
# The external connector maps onto bridge1, the libvirt routed network a
# fork customize script creates on the CML host at 10.100.0.1/24. sw1 is
# 10.100.0.2 on it, the address the host routes 10.100.0.0/16 to (ADR
# 0003), so ISE and the domain controller reach the endpoints through it.
# The NAT connector gives ftd1 its management path to cdFMC and lets
# emp-pc, kali and srv pull packages over a second interface. An external
# connector has one port, so nat-sw, an unmanaged switch, fans it out;
# that makes eleven nodes where the spec counted ten.
#
# emp-pc and iot-dev set real vendor MAC prefixes (Dell, HP) inside the
# guest, because ISE's first classification is the MAC vendor and CML's own
# 52:54:00 prefix maps to nobody; CML refuses any other prefix on the NIC
# itself. kali keeps the CML prefix on purpose: it is the unknown device.
#
# Render with scripts/60-import-lab.sh, which fills __LAB_PASSWORD__,
# the four __SNMP_*__ values (labs.env, Act 1),
# __FTD_ADMIN_PASSWORD__, __ISE_IP__ and __RADIUS_SECRET__ from
# config/mcp-env/labs.env and __LAB_SSH_PUBKEY__ from keys/cml-lab.pub
# (ADR 0006). emp-pc's PEAP password is the literal CHANGE_ME: the AD
# user's password lives in ad.env, which the import does not read, so
# Act 2 step 5 sets it on the node before enabling the supplicant.
#
# Addresses
#   transit   10.100.0.0/24    host .1, sw1 Vlan100 .2, ISE at __ISE_IP__
#   endpoints 10.100.10.0/24   sw1 Vlan10 .1, DHCP .100 to .199, DNS 10.20.2.10
#   firewall  10.100.11.0/29   sw1 Vlan11 .1, the running firewall inside .2
#   servers   10.100.20.0/24   the running firewall .1, srv .10
#   ftd mgmt  192.168.255.0/24 NAT .1, ftd1 .81
#
# RAM: sw1 18 GB, kali 4, emp-pc 2, iot-dev 0.5, asa1 2, ftd1 8, srv 2.
# Act 1 alone 24.5 GB; with ASAv and srv 28.5; with FTDv and srv 34.5.
---
lab:
  title: TrustSec Phase 2
  description: A cat9000v access switch on the transit bridge, three endpoints, ASAv or FTDv enforcing by tag, and a server.
  version: 0.1.0
