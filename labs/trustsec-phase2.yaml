    content: |-
      #cloud-config
      hostname: srv
      manage_etc_hosts: true
      ssh_pwauth: true
      users:
        - name: cisco
          groups: sudo
          sudo: ALL=(ALL) NOPASSWD:ALL
          shell: /bin/bash
          lock_passwd: false
          ssh_authorized_keys:
            - __LAB_SSH_PUBKEY__
      chpasswd:
        users:
          - name: cisco
            password: '__LAB_PASSWORD__'
            type: text
        expire: false
      package_update: true
