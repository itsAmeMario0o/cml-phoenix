  - id: n6-GigabitEthernet0_1
    label: GigabitEthernet0/1
    type: physical
    slot: 2
  configuration:
  - name: day0-config
    content: |-
      hostname asa1
      enable password __LAB_PASSWORD__
      username admin password __LAB_PASSWORD__ privilege 15
      interface Management0/0
       shutdown
      interface GigabitEthernet0/0
       nameif inside
       security-level 100
       ip address 10.100.11.2 255.255.255.248
       no shutdown
      interface GigabitEthernet0/1
       nameif servers
       security-level 50
       ip address 10.100.20.1 255.255.255.0
       no shutdown
      route inside 10.100.10.0 255.255.255.0 10.100.11.1 1
      route inside 10.100.0.0 255.255.0.0 10.100.11.1 1
      ! Act 1 baseline. Act 2 step 7 replaces it with rules by security-group tag.
      access-list ALLOW-ALL extended permit ip any any
      access-group ALLOW-ALL in interface inside
      access-group ALLOW-ALL in interface servers
      aaa authentication ssh console LOCAL
      aaa authentication http console LOCAL
      http server enable
      http 10.100.0.0 255.255.0.0 inside
      ssh 10.100.0.0 255.255.0.0 inside
      ssh version 2
      crypto key generate rsa modulus 2048
      end
