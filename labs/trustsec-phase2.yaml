  configuration:
  - name: iosxe_config.txt
    content: |
      hostname sw1
      no logging console
      aaa new-model
      aaa group server radius ISE-GROUP
       server name ISE
      aaa authentication login default local
      aaa authentication dot1x default group ISE-GROUP
      aaa authorization network default group ISE-GROUP
      aaa accounting dot1x default start-stop group ISE-GROUP
      aaa server radius dynamic-author
       client __ISE_IP__ server-key __RADIUS_SECRET__
      aaa session-id common
      ip routing
      ip name-server 10.20.2.10
      ip domain lookup source-interface Vlan100
      ip domain name corp.rooez.com
      license boot level network-advantage addon dna-advantage
      dot1x system-auth-control
      spanning-tree mode rapid-pvst
      enable secret __LAB_PASSWORD__
      username admin privilege 15 secret __LAB_PASSWORD__
      ! Act 2, step 6: cts role-based enforcement
      vlan 10
       name endpoints
      vlan 11
       name firewall
      vlan 100
       name transit
      ip dhcp excluded-address 10.100.10.1 10.100.10.99
      ip dhcp excluded-address 10.100.10.200 10.100.10.254
      ip dhcp pool ENDPOINTS
       network 10.100.10.0 255.255.255.0
       default-router 10.100.10.1
       dns-server 10.20.2.10
       domain-name corp.rooez.com
       lease 1
      interface GigabitEthernet0/0
       shutdown
      interface GigabitEthernet1/0/1
       description emp-pc, Act 2 802.1X PEAP
       switchport access vlan 10
       switchport mode access
       authentication open
       authentication port-control auto
       authentication violation replace
       mab
       dot1x pae authenticator
       dot1x timeout tx-period 5
       spanning-tree portfast
      interface GigabitEthernet1/0/2
       description iot-dev, Act 2 MAB
       switchport access vlan 10
       switchport mode access
       authentication open
       authentication port-control auto
       authentication violation replace
       mab
       dot1x pae authenticator
       dot1x timeout tx-period 5
       spanning-tree portfast
      interface GigabitEthernet1/0/3
       description kali, Act 2 MAB
       switchport access vlan 10
       switchport mode access
       authentication open
       authentication port-control auto
       authentication violation replace
       mab
       dot1x pae authenticator
       dot1x timeout tx-period 5
       spanning-tree portfast
      interface GigabitEthernet1/0/22
       description asa1 GigabitEthernet0/0 inside
       switchport access vlan 11
       switchport mode access
       spanning-tree portfast
       ! Act 2, step 7: cts manual
       ! Act 2, step 7:  propagate sgt
      interface GigabitEthernet1/0/23
       description ftd1 GigabitEthernet0/0 inside
       switchport access vlan 11
       switchport mode access
       spanning-tree portfast
       ! Act 2, step 7: cts manual
       ! Act 2, step 7:  propagate sgt
      interface GigabitEthernet1/0/24
       description transit bridge1, host gateway 10.100.0.1 (ADR 0003)
       switchport access vlan 100
       switchport mode access
      interface Vlan1
       no ip address
       shutdown
      interface Vlan10
       description endpoints, DHCP from this switch
       ip address 10.100.10.1 255.255.255.0
      interface Vlan11
       description the running firewall's inside at .2
       ip address 10.100.11.1 255.255.255.248
      interface Vlan100
       description transit to the host, ISE and the domain controller
       ip address 10.100.0.2 255.255.255.0
      ip route 0.0.0.0 0.0.0.0 10.100.0.1
      ip route 10.100.20.0 255.255.255.0 10.100.11.2
      ip radius source-interface Vlan100
      radius server ISE
       address ipv4 __ISE_IP__ auth-port 1812 acct-port 1813
       key __RADIUS_SECRET__
      ip ssh version 2
      line con 0
       exec-timeout 0 0
       logging synchronous
      line vty 0 15
       exec-timeout 0 0
       login authentication default
       transport input ssh
      end
- id: n3
  label: emp-pc
  node_definition: ubuntu
  image_definition: ubuntu-24-04-20260307
  x: -300
  y: 300
  interfaces:
  - id: n3-ens2
    label: ens2
    type: physical
    slot: 0
  - id: n3-ens3
    label: ens3
    type: physical
    slot: 1
  configuration:
  - name: user-data
    content: |-
      #cloud-config
      hostname: emp-pc
      manage_etc_hosts: true
      ssh_pwauth: true
      users:
        - name: cisco
          groups: sudo
          sudo: ALL=(ALL) NOPASSWD:ALL
          shell: /bin/bash
          lock_passwd: false
          ssh_authorized_keys:
            - __LAB_SSH_PUBKEY__
      chpasswd:
        users:
          - name: cisco
            password: '__LAB_PASSWORD__'
            type: text
        expire: false
      package_update: true
      packages:
        - wpasupplicant
        - snmpd
      write_files:
        - path: /etc/snmp/snmpd.conf
          permissions: '0600'
          content: |
            # Act 1, step 5: ISE's endpoint SNMP scan asks the endpoint
            # itself. v3 first, v2c kept for the comparison.
            agentAddress udp:161
            sysLocation cml-azure-lab, TrustSec Phase 2, VLAN 10
            sysContact lab-owner
            createUser __SNMP_V3_USER__ SHA "__SNMP_V3_AUTH_PASSWORD__" AES "__SNMP_V3_PRIV_PASSWORD__"
            rouser __SNMP_V3_USER__ priv
            rocommunity __SNMP_RO_COMMUNITY__ 10.20.2.20
        - path: /etc/wpa_supplicant/wired-peap.conf
          permissions: '0600'
          content: |
            # Act 2, step 5. The password is the AD lab user's, from
            # config/mcp-env/ad.env, set by hand before enabling the unit.
            ctrl_interface=/run/wpa_supplicant
            ap_scan=0
            network={
                key_mgmt=IEEE8021X
                eap=PEAP
                identity="mario"
                password="CHANGE_ME"
                phase2="auth=MSCHAPV2"
                eapol_flags=0
            }
        - path: /etc/systemd/system/wired-peap.service
          content: |
            [Unit]
            Description=802.1X PEAP supplicant on ens2 (Act 2, step 5)
            After=network-online.target
            [Service]
            ExecStartPre=/usr/sbin/ip link set ens2 up
            ExecStart=/usr/sbin/wpa_supplicant -D wired -i ens2 -c /etc/wpa_supplicant/wired-peap.conf
            Restart=on-failure
            [Install]
            WantedBy=multi-user.target
      runcmd:
        - [systemctl, daemon-reload]
        - [systemctl, restart, snmpd]
  - name: network-config
    content: |-
      #network-config
      # ens2 is the access port: DHCP from sw1, but no default route from
      # it, so packages go out over the NAT side and the lab's 10/8 goes
      # through the switch. on-link because the gateway arrives with the
      # lease.
      network:
        version: 2
        ethernets:
          ens2:
            # A Dell prefix: ISE's first classification is the MAC vendor,
            # and CML's own 52:54:00 maps to nobody.
            macaddress: 00:14:22:5a:10:01
            dhcp4: true
            # Key the lease by MAC, as a Windows or printer client would;
            # networkd's default DUID hides the MAC from the switch's
            # binding table and from ISE's DHCP probe.
            dhcp-identifier: mac
            dhcp4-overrides:
              use-routes: false
            routes:
              - to: 10.0.0.0/8
                via: 10.100.10.1
                on-link: true
          ens3:
            dhcp4: true
- id: n4
  label: iot-dev
  node_definition: alpine
  image_definition: alpine-base-3-23-3
  x: 0
  y: 300
  interfaces:
  - id: n4-eth0
    label: eth0
    type: physical
    slot: 0
  configuration:
  - name: node.cfg
    content: |-
      # Sourced by root at boot, after networking and before the image
      # creates the user. Looks like an HP printer to a DHCP profiler:
      # hostname and vendor class (option 60) are what ISE's HP-Device
      # and printer profiles key on. The image's own udhcpc sends
      # hostname localhost and no vendor class, so it is replaced.
      hostname hp-printer-01
      USERNAME=cisco
      PASSWORD=__LAB_PASSWORD__
      kill "$(cat /var/run/udhcpc.eth0.pid)" 2>/dev/null
      # An HP prefix on the wire, for the same reason as emp-pc's Dell one.
      ip link set eth0 down; ip link set eth0 address 3c:d9:2b:7e:10:02; ip link set eth0 up
      udhcpc -i eth0 -b -R -p /var/run/udhcpc.eth0.pid -x hostname:hp-printer-01 -V "Hewlett-Packard JetDirect"
      adduser -D cisco 2>/dev/null
      install -d -m 700 -o cisco -g cisco /home/cisco/.ssh
      echo "__LAB_SSH_PUBKEY__" > /home/cisco/.ssh/authorized_keys
      chown cisco:cisco /home/cisco/.ssh/authorized_keys
