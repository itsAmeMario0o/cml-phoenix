- id: n8
  label: insrv
  node_definition: ubuntu
  image_definition: ubuntu-24-04-20260307
  x: -500
  y: -150
  interfaces:
  - id: n8-ens2
    label: ens2
    type: physical
    slot: 0
  configuration:
  - name: user-data
    content: |-
      #cloud-config
      hostname: insrv
      manage_etc_hosts: true
      ssh_pwauth: true
      users:
        - name: cisco
          groups: sudo
          sudo: ALL=(ALL) NOPASSWD:ALL
          shell: /bin/bash
          lock_passwd: false
          ssh_authorized_keys:
            - __LAB_SSH_PUBKEY__
      chpasswd:
        users:
          - name: cisco
            password: '__LAB_PASSWORD__'
            type: text
        expire: false
      write_files:
        - path: /etc/netplan/60-static.yaml
          permissions: '0600'
          content: |
            network:
              version: 2
              ethernets:
                ens2:
                  dhcp4: false
                  addresses: [10.10.0.10/24]
                  routes:
                    - to: default
                      via: 10.10.0.1
      runcmd:
        - rm -f /etc/netplan/50-cloud-init.yaml
        - netplan apply
