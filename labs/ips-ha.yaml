# Inline IPS with a Threat Defense HA pair. One Nexus 9300v as the
# switch, a cat8000v edge as the internet with the inside gateway and
# a DHCP scope, two FTDv in high availability each with an inline set
# bridging VLAN 10 to VLAN 20, Kali and an Ubuntu server inside, two
# Ubuntu servers outside. Managed by cdFMC.
# Spec: docs/superpowers/specs/2026-09-11-ips-ha-lab-design.md.
#
# Every node boots configured. Placeholders come from
# config/mcp-env/labs.env through scripts/60-import-lab.sh (ADR 0006).
# Management on the NAT connector, 192.168.255.0/24, gateway .1:
#   n9k1 .71  edge .73  ftd1 .81  ftd2 .82
---
lab:
  title: Inline IPS, FTD HA pair
  description: Kali attacks outside servers through an inline set on an FTDv HA pair managed by cdFMC.
  version: 0.1.0
