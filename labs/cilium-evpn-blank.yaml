# Cilium EVPN fabric, blank edition. Two Nexus 9000v spines, four leaves,
# an Ubuntu host for a kind cluster with Cilium, and two Ubuntu endpoints.
# The switches boot with only what it takes to log in: hostname, admin
# user, mgmt0 address, and the loader-prompt workaround. The fabric itself
# (underlay, VXLAN, VRFs, BGP toward Cilium) is left for you to build.
#
# Adapted from marinfer/cml-cilium-evpn-lab. Changes from the source:
# the management network rides the CML NAT connector (192.168.255.0/24,
# gateway .1) instead of the System Bridge, image names match
# config/refplat.txt, and every password is a placeholder. Render with
# scripts/60-import-lab.sh, which fills __LAB_PASSWORD__ from
# config/mcp-env/labs.env and __LAB_SSH_PUBKEY__ from keys/cml-lab.pub.
# ADR 0006 for why the tracked file carries placeholders.
#
# Management addresses
#   spine1 192.168.255.50   spine2 192.168.255.60
#   leaf1  192.168.255.51   leaf2  192.168.255.52
#   leaf3  192.168.255.53   leaf4  192.168.255.54
#   kind-host 192.168.255.5 (ens2)
# Fabric links
#   leafN Ethernet1/1 -> spine1 Ethernet1/N, leafN Ethernet1/2 -> spine2 Ethernet1/N
#   kind-host ens3..ens6 -> leaf1..leaf4 Ethernet1/6
#   red-endpoint -> leaf1 Ethernet1/7, blue-endpoint -> leaf2 Ethernet1/7
