! leaf4: eBGP VXLAN EVPN fabric, leaf tier AS 65000
! Underlay: eBGP ipv4 unicast to both spines, allowas-in because every
! leaf shares the AS. Overlay: eBGP l2vpn evpn to both spine loopbacks.
! VRFs red (L3VNI 50000) and blue (L3VNI 50001), networks VLAN 100 and
! 200 (L2VNI 30000 and 30001) with anycast gateways. Ethernet1/6 toward
! the kind host is left for the Cilium step.
!
nv overlay evpn
feature bgp
feature pim
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
feature fabric forwarding
!
fabric forwarding anycast-gateway-mac 1234.5678.9000
ip pim rp-address 10.254.254.1 group-list 239.1.1.0/25
!
vlan 100
  name Net-Red
  vn-segment 30000
vlan 200
  name Net-Blue
  vn-segment 30001
vlan 2000
  name red-l3vni
  vn-segment 50000
vlan 2001
  name blue-l3vni
  vn-segment 50001
!
vrf context red
  vni 50000
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn
vrf context blue
  vni 50001
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn
!
route-map REDIST-SUBNETS permit 10
  match tag 12345
!
interface loopback0
  description underlay router-id and EVPN peering
  ip address 10.2.0.14/32
  ip pim sparse-mode
!
interface loopback1
  description VTEP source
  ip address 10.3.0.14/32
  ip pim sparse-mode
!
interface Ethernet1/1
  description to spine1 Ethernet1/4
  no switchport
  mtu 9216
  ip address 10.4.0.26/30
  ip pim sparse-mode
  no shutdown
!
interface Ethernet1/2
  description to spine2 Ethernet1/4
  no switchport
  mtu 9216
  ip address 10.4.0.30/30
  ip pim sparse-mode
  no shutdown
!
interface Vlan100
  description Net-Red anycast gateway
  no shutdown
  vrf member red
  no ip redirects
  ip address 10.0.100.1/24 tag 12345
  ip proxy-arp
  fabric forwarding mode anycast-gateway
!
interface Vlan200
  description Net-Blue anycast gateway
  no shutdown
  vrf member blue
  no ip redirects
  ip address 10.0.200.1/24 tag 12345
  ip proxy-arp
  fabric forwarding mode anycast-gateway
!
interface Vlan2000
  description red L3VNI
  no shutdown
  mtu 9216
  vrf member red
  no ip redirects
  ip forward
!
interface Vlan2001
  description blue L3VNI
  no shutdown
  mtu 9216
  vrf member blue
  no ip redirects
  ip forward
!
interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  member vni 30000
    mcast-group 239.1.1.1
  member vni 30001
    mcast-group 239.1.1.2
  member vni 50000 associate-vrf
  member vni 50001 associate-vrf
!
evpn
  vni 30000 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 30001 l2
    rd auto
    route-target import auto
    route-target export auto
!
router bgp 65000
  router-id 10.2.0.14
  log-neighbor-changes
  address-family ipv4 unicast
    network 10.2.0.14/32
    network 10.3.0.14/32
    maximum-paths 4
  neighbor 10.4.0.25
    description spine1 underlay
    remote-as 65010
    address-family ipv4 unicast
      allowas-in
  neighbor 10.4.0.29
    description spine2 underlay
    remote-as 65010
    address-family ipv4 unicast
      allowas-in
  neighbor 10.2.0.1
    description spine1 overlay
    remote-as 65010
    update-source loopback0
    ebgp-multihop 5
    address-family l2vpn evpn
      allowas-in
      send-community
      send-community extended
  neighbor 10.2.0.2
    description spine2 overlay
    remote-as 65010
    update-source loopback0
    ebgp-multihop 5
    address-family l2vpn evpn
      allowas-in
      send-community
      send-community extended
  vrf red
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map REDIST-SUBNETS
      maximum-paths 4
  vrf blue
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map REDIST-SUBNETS
      maximum-paths 4
