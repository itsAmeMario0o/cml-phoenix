! spine2: eBGP VXLAN EVPN fabric, spine tier AS 65010
! Underlay: eBGP ipv4 unicast to every leaf over /30 links, loopbacks
! advertised with network statements. Overlay: eBGP l2vpn evpn to every
! leaf loopback0, next hop left unchanged. Anycast RP with spine1.
!
nv overlay evpn
feature bgp
feature pim
!
ip pim rp-address 10.254.254.1 group-list 239.1.1.0/25
ip pim anycast-rp 10.254.254.1 10.2.0.1
ip pim anycast-rp 10.254.254.1 10.2.0.2
!
interface loopback0
  description underlay router-id and EVPN peering
  ip address 10.2.0.2/32
  ip pim sparse-mode
!
interface loopback254
  description anycast RP
  ip address 10.254.254.1/32
  ip pim sparse-mode
!
interface Ethernet1/1
  description to leaf1 Ethernet1/2
  no switchport
  mtu 9216
  ip address 10.4.0.5/30
  ip pim sparse-mode
  no shutdown
!
interface Ethernet1/2
  description to leaf2 Ethernet1/2
  no switchport
  mtu 9216
  ip address 10.4.0.13/30
  ip pim sparse-mode
  no shutdown
!
interface Ethernet1/3
  description to leaf3 Ethernet1/2
  no switchport
  mtu 9216
  ip address 10.4.0.21/30
  ip pim sparse-mode
  no shutdown
!
interface Ethernet1/4
  description to leaf4 Ethernet1/2
  no switchport
  mtu 9216
  ip address 10.4.0.29/30
  ip pim sparse-mode
  no shutdown
!
route-map NEXT-HOP-UNCHANGED permit 10
  set ip next-hop unchanged
!
router bgp 65010
  router-id 10.2.0.2
  log-neighbor-changes
  address-family ipv4 unicast
    network 10.2.0.2/32
    network 10.254.254.1/32
    maximum-paths 4
  address-family l2vpn evpn
    retain route-target all
  neighbor 10.4.0.6
    description leaf1 underlay
    remote-as 65000
    address-family ipv4 unicast
      disable-peer-as-check
  neighbor 10.4.0.14
    description leaf2 underlay
    remote-as 65000
    address-family ipv4 unicast
      disable-peer-as-check
  neighbor 10.4.0.22
    description leaf3 underlay
    remote-as 65000
    address-family ipv4 unicast
      disable-peer-as-check
  neighbor 10.4.0.30
    description leaf4 underlay
    remote-as 65000
    address-family ipv4 unicast
      disable-peer-as-check
  neighbor 10.2.0.11
    description leaf1 overlay
    remote-as 65000
    update-source loopback0
    ebgp-multihop 5
    address-family l2vpn evpn
      disable-peer-as-check
      send-community
      send-community extended
      route-map NEXT-HOP-UNCHANGED out
  neighbor 10.2.0.12
    description leaf2 overlay
    remote-as 65000
    update-source loopback0
    ebgp-multihop 5
    address-family l2vpn evpn
      disable-peer-as-check
      send-community
      send-community extended
      route-map NEXT-HOP-UNCHANGED out
  neighbor 10.2.0.13
    description leaf3 overlay
    remote-as 65000
    update-source loopback0
    ebgp-multihop 5
    address-family l2vpn evpn
      disable-peer-as-check
      send-community
      send-community extended
      route-map NEXT-HOP-UNCHANGED out
  neighbor 10.2.0.14
    description leaf4 overlay
    remote-as 65000
    update-source loopback0
    ebgp-multihop 5
    address-family l2vpn evpn
      disable-peer-as-check
      send-community
      send-community extended
      route-map NEXT-HOP-UNCHANGED out
