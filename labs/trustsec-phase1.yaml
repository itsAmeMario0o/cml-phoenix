# TrustSec Phase 1 proof: a single cat8000v lab edge as a RADIUS network
# access device against the external ISE. No Catalyst 9000v fabric yet;
# that is Phase 2. This topology proves the routed path, RADIUS, and CoA
# on their own: the edge sits on the host transit bridge and talks to
# ISE with no NAT in between (ADR 0003).
#
# The external connector maps onto bridge1, the libvirt routed network a fork
# customize script creates on the CML host at 10.100.0.1/24 (Task 2 of
# this build). The edge takes 10.100.0.2/24 on that segment with a
# default route back through the host.
#
# Render with scripts/60-import-lab.sh, which fills __LAB_PASSWORD__ and
# __LAB_SSH_PUBKEY__ from config/mcp-env/labs.env and keys/cml-lab.pub,
# and __ISE_IP__ / __RADIUS_SECRET__ from the same labs.env file. ADR
# 0006 for why the tracked file carries placeholders instead of the real
# ISE address and shared secret.
#
# Addresses
#   edge  10.100.0.2/24 on the transit bridge, gateway 10.100.0.1
#   ISE   __ISE_IP__, on the apps subnet, outside this topology
---
lab:
  title: TrustSec Phase 1 proof
  description: A cat8000v edge as a RADIUS NAD against the external ISE, proving the routed path and CoA.
  version: 0.1.0
nodes:
- id: n0
  label: bridge1
  node_definition: external_connector
  x: -300
  y: 0
  interfaces:
  - id: n0-port
    label: port
    type: physical
    slot: 0
  configuration:
  - name: default
    content: bridge1
- id: n1
  label: edge
  node_definition: cat8000v
  image_definition: cat8000v-17-18-02
  x: 0
  y: 0
  interfaces:
  - id: n1-GigabitEthernet1
    label: GigabitEthernet1
    type: physical
    slot: 0
  - id: n1-GigabitEthernet2
    label: GigabitEthernet2
    type: physical
    slot: 1
  - id: n1-GigabitEthernet3
    label: GigabitEthernet3
    type: physical
    slot: 2
  - id: n1-GigabitEthernet4
    label: GigabitEthernet4
    type: physical
    slot: 3
  configuration:
  - name: iosxe_config.txt
    content: |
      hostname edge
      no ip domain lookup
      ip domain name lab.local
      username admin privilege 15 secret __LAB_PASSWORD__
      aaa new-model
      radius server ISE
       address ipv4 __ISE_IP__ auth-port 1812 acct-port 1813
       key __RADIUS_SECRET__
      aaa group server radius ISE-GROUP
       server name ISE
      aaa authentication login default local
      ! Inert until the Phase 2 802.1X edge: no dot1x system-auth-control
      ! and no 802.1X access port exist yet. Phase 1 proves only the
      ! routed path plus RADIUS and CoA.
      aaa authentication dot1x default group ISE-GROUP
      aaa authorization network default group ISE-GROUP
      aaa authorization exec default group ISE-GROUP local
      aaa server radius dynamic-author
       client __ISE_IP__ server-key __RADIUS_SECRET__
      interface GigabitEthernet1
       description transit bridge, host gateway 10.100.0.1 (ADR 0003)
       ip address 10.100.0.2 255.255.255.0
       no shutdown
      ip route 0.0.0.0 0.0.0.0 10.100.0.1
      line con 0
       exec-timeout 0 0
       logging synchronous
      line vty 0 4
       login local
       transport input ssh
      end
links:
- id: l0
  n1: n0
  i1: n0-port
  n2: n1
  i2: n1-GigabitEthernet1
