! edge: cat8000v, AS 65100. Routed uplinks to both Nexus, a LAN for
! outside-host, and a loopback that stands in for the internet. Sends a
! default route to the pair and learns 10.10.0.0/24 and 10.20.0.0/24.
!
interface Loopback0
 description stands in for the internet
 ip address 198.51.100.1 255.255.255.255
!
interface GigabitEthernet2
 description to n9k1 Ethernet1/3
 ip address 10.0.1.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet3
 description to n9k2 Ethernet1/3
 ip address 10.0.1.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet4
 description outside-host LAN
 ip address 203.0.113.1 255.255.255.0
 no shutdown
!
router bgp 65100
 bgp router-id 198.51.100.1
 bgp log-neighbor-changes
 neighbor 10.0.1.1 remote-as 65020
 neighbor 10.0.1.1 description n9k1
 neighbor 10.0.1.5 remote-as 65020
 neighbor 10.0.1.5 description n9k2
 address-family ipv4
  network 198.51.100.1 mask 255.255.255.255
  network 203.0.113.0
  neighbor 10.0.1.1 activate
  neighbor 10.0.1.1 default-originate
  neighbor 10.0.1.5 activate
  neighbor 10.0.1.5 default-originate
  maximum-paths 2
 exit-address-family
