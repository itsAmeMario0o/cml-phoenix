! n9k2: vPC pair member, AS 65020. Peer link Po10 on Ethernet1/1-2,
! keepalive over mgmt0. VLAN 10 inside in VRF INSIDE, VLAN 20 outside in
! the default VRF, HSRP on both. ECMP static routes to the two FTDv nodes
! in each direction. eBGP to the edge on Ethernet1/3.
!
feature bgp
feature interface-vlan
feature hsrp
feature lacp
feature vpc
!
vrf context INSIDE
  ip route 0.0.0.0/0 10.10.0.11
  ip route 0.0.0.0/0 10.10.0.12
!
vlan 10
  name inside
vlan 20
  name outside
!
vpc domain 10
  peer-switch
  role priority 20
  peer-keepalive destination 192.168.255.71 source 192.168.255.72 vrf management
  peer-gateway
  ip arp synchronize
!
interface port-channel10
  description vPC peer link to n9k1
  switchport
  switchport mode trunk
  spanning-tree port type network
  vpc peer-link
!
interface Ethernet1/1
  description peer link to n9k1 Ethernet1/1
  switchport
  switchport mode trunk
  channel-group 10 mode active
  no shutdown
!
interface Ethernet1/2
  description peer link to n9k1 Ethernet1/2
  switchport
  switchport mode trunk
  channel-group 10 mode active
  no shutdown
!
interface Ethernet1/3
  description to edge GigabitEthernet3
  no switchport
  ip address 10.0.1.5/30
  no shutdown
!
interface Ethernet1/10
  description ftd2 GigabitEthernet0/1 inside
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown
!
interface Ethernet1/11
  description ftd2 GigabitEthernet0/2 outside
  switchport
  switchport mode access
  switchport access vlan 20
  spanning-tree port type edge
  no shutdown
!
interface port-channel20
  description inside-host bond, vPC 20
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  vpc 20
!
interface Ethernet1/12
  description inside-host
  switchport
  switchport mode access
  switchport access vlan 10
  channel-group 20 mode active
  no shutdown
!
interface Vlan10
  description inside, VRF INSIDE
  no shutdown
  vrf member INSIDE
  no ip redirects
  ip address 10.10.0.3/24
  hsrp version 2
  hsrp 10
    preempt
    priority 100
    ip 10.10.0.1
!
interface Vlan20
  description outside, default VRF
  no shutdown
  no ip redirects
  ip address 10.20.0.3/24
  hsrp version 2
  hsrp 20
    preempt
    priority 100
    ip 10.20.0.1
!
ip route 10.10.0.0/24 10.20.0.11
ip route 10.10.0.0/24 10.20.0.12
!
ip prefix-list INSIDE-NET seq 5 permit 10.10.0.0/24
route-map REDIST-STATIC permit 10
  match ip address prefix-list INSIDE-NET
!
router bgp 65020
  router-id 10.0.1.5
  log-neighbor-changes
  address-family ipv4 unicast
    network 10.20.0.0/24
    redistribute static route-map REDIST-STATIC
    maximum-paths 4
  neighbor 10.0.1.6
    description edge
    remote-as 65100
    address-family ipv4 unicast
