#
# Kali Linux node definition for this kit. Cloned from CML's ubuntu
# definition with the sizing Kali wants and no cloud-init expectation:
# the official Kali QEMU image has no cloud-init, boots with user kali
# and password kali, and asks for DHCP on its first interface. The
# cidata volume is kept so the workbench behaves like it does for
# Ubuntu; the image ignores it. Registered on the controller through
# POST /api/v0/node_definitions (LESSONS-LEARNED, "A new image can reach
# the controller without a rebuild"). Image definition: kali-2026-2.
#

id: kali
sim:
  linux_native:
    driver: server
    libvirt_domain_driver: kvm
    disk_driver: virtio
    nic_driver: virtio
    ram: 4096
    cpus: 2
    data_volume: 0
    boot_disk_size: 96
inherited:
  image:
    ram: true
    cpus: true
    cpu_limit: true
    data_volume: true
    boot_disk_size: true
  node:
    ram: true
    cpus: true
    cpu_limit: true
    data_volume: true
    boot_disk_size: true
general:
  nature: server
  description: Kali Linux, official QEMU image
  read_only: false
schema_version: 0.0.1
configuration:
  generator:
    driver: ubuntu
  provisioning:
    volume_name: cidata
    media_type: iso
    files:
      - name: meta-data
        content: |
          instance-id: kali
          local-hostname: kali
        editable: false
      - name: user-data
        content: |
          #cloud-config
          # Ignored by the Kali QEMU image, which has no cloud-init.
          hostname: kali
        editable: true
device:
  interfaces:
    physical:
      - eth0
      - eth1
      - eth2
      - eth3
    has_loopback_zero: false
    default_count: 1
    serial_ports: 1
boot:
  timeout: 300
  completed:
    - "login:"
pyats:
  os: linux
  username: kali
  password: kali
ui:
  group: Others
  icon: host
  label: Kali
  label_prefix: kali-
  visible: true
  description: |
    Kali Linux from the official QEMU image.

    4 GB DRAM, 2 vCPU (can be adjusted). Login kali / kali on the
    console. The first interface asks for DHCP; give it a server on
    that segment or set an address by hand. No cloud-init.
